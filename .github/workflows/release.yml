# Builds FogForge from source, signs it via SignPath (once SignPath is set up)
# and publishes "FogForge Setup.exe" as a GitHub release.
# Runs when a version tag (v1.2.3) appears - also when a release with a new tag
# is published on GitHub. If the release exists, the installer is attached to it;
# otherwise the release is created (notes from the annotated tag message).
name: Build release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, e.g. v4.1.3"
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

      - name: Check version
        shell: pwsh
        run: |
          $m = Select-String -Path src/DbdPackManager.cs -Pattern 'public const string Version = "([\d.]+)"' | Select-Object -First 1
          $ver = $m.Matches[0].Groups[1].Value
          if ("v$ver" -ne $env:TAG) { throw "Tag $env:TAG does not match the version in the source code (v$ver). Use tag v$ver." }
          Write-Host "Building FogForge $ver"

      - name: Build FogForge.exe
        shell: pwsh
        run: ./build.ps1 -Stage app

      # ---- signing (only when SignPath is configured) ----
      - name: Upload unsigned app
        if: env.SIGN == 'true'
        id: up-app
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: out/FogForge.exe
      - name: Sign app
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FogForge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.up-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app
      - name: Use signed app
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item signed-app/FogForge.exe out/FogForge.exe -Force

      - name: Build installer
        shell: pwsh
        run: ./build.ps1 -Stage setup -AppExe out/FogForge.exe

      - name: Upload unsigned installer
        if: env.SIGN == 'true'
        id: up-setup
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: out/FogForge Setup.exe
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'FogForge' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.up-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - name: Use signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: Copy-Item "signed-setup/FogForge Setup.exe" "out/FogForge Setup.exe" -Force

      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item "out/FogForge Setup.exe" "out/FogForge.Setup.exe" -Force
          $ver = $env:TAG.TrimStart('v')
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "out/FogForge.Setup.exe" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            # release notes = message of the annotated tag
            git fetch --force origin "refs/tags/$($env:TAG):refs/tags/$($env:TAG)" 2>$null
            $notes = (git for-each-ref "refs/tags/$($env:TAG)" --format='%(contents)') -join "`n"
            if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "FogForge $ver" }
            Set-Content -Path out/notes.md -Value $notes -Encoding utf8
            gh release create $env:TAG "out/FogForge.Setup.exe" --repo $env:GITHUB_REPOSITORY --title "FogForge $ver" --notes-file out/notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed" }
          (Get-FileHash "out/FogForge.Setup.exe" -Algorithm SHA256).Hash
